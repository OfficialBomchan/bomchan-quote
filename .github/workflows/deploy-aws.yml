name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package app (exclude node_modules/.next/data/uploads)
        run: |
          mkdir /tmp/eb-stage
          rsync -a --exclude node_modules --exclude .next --exclude .git \
            --exclude data --exclude .github --exclude public/uploads \
            --exclude .env.local ./ /tmp/eb-stage/
          cd /tmp/eb-stage
          zip -r -X /tmp/bomchan-quote-eb.zip . >/dev/null

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: bomchan-quote
          environment_name: bomchan-quote-prod
          region: ap-northeast-2
          version_label: "gh-${{ github.run_number }}"
          deployment_package: /tmp/bomchan-quote-eb.zip
