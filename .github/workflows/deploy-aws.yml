name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches: [master]

# 연달아 두 번 push하면 두 배포가 동시에 시작돼서 "환경이 아직 준비 안 됨" 에러로
# 실패하는 일이 있었다. 같은 환경을 배포하는 작업은 한 번에 하나씩만, 순서대로
# 돌게 해서 이 충돌을 원천적으로 막는다.
concurrency:
  group: deploy-bomchan-quote-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run parser regression tests
        run: node --test lib/*.test.js

      - name: Package app (exclude node_modules/.next/data/uploads)
        run: |
          mkdir /tmp/eb-stage
          rsync -a --exclude node_modules --exclude .next --exclude .git \
            --exclude data --exclude .github --exclude public/uploads \
            --exclude .env.local ./ /tmp/eb-stage/
          cd /tmp/eb-stage
          zip -r -X /tmp/bomchan-quote-eb.zip . >/dev/null

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Wait until environment is Ready
        run: |
          for i in $(seq 1 30); do
            status=$(aws elasticbeanstalk describe-environments \
              --application-name bomchan-quote \
              --environment-names bomchan-quote-prod \
              --query "Environments[0].Status" --output text)
            echo "Environment status: $status"
            if [ "$status" = "Ready" ]; then exit 0; fi
            sleep 10
          done
          echo "Timed out waiting for environment to become Ready" >&2
          exit 1

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: bomchan-quote
          environment_name: bomchan-quote-prod
          region: ap-northeast-2
          version_label: "gh-${{ github.run_number }}-${{ github.run_attempt }}"
          deployment_package: /tmp/bomchan-quote-eb.zip
          use_existing_version_if_available: true
